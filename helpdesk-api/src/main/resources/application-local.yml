
spring:
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=HelpDeskDB;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:helpdesk_app}
    password: ${DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false


  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/helpdesk}

  data:
    mongodb:
      auto-index-creation: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: 86400000

  scheduler:
    overdue-ticket:
      fixed-delay: 60000
