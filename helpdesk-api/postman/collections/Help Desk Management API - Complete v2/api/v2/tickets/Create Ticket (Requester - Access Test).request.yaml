$kind: http-request
description: ""
url: "{{baseUrl}}/api/v2/tickets"
method: POST
headers:
  Content-Type: application/json
  Accept: "*/*"
body:
  type: json
  content: |-
    {
      "description": "Testing",
      "priority": "MEDIUM",
      "title": "Create Ticket (Requester - Access Test)"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "title": {
          "type": "string",
          "minLength": 0,
          "maxLength": 150
        },
        "description": {
          "type": "string",
          "minLength": 0,
          "maxLength": 2000
        },
        "priority": {
          "type": "string",
          "enum": [
            "HIGH",
            "MEDIUM",
            "LOW"
          ]
        }
      },
      "required": [
        "description",
        "priority",
        "title"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{requesterToken}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Requester can create a ticket\", function () {\r

      \    pm.response.to.have.status(201);\r

      });\r

      \r

      pm.test(\"Created ticket ID is returned\", function () {\r

      \    const data = pm.response.json();\r

      \r

      \    pm.expect(data.id).to.exist;\r

      \    pm.expect(data.requesterId).to.eql(4);\r

      \r

      \    pm.collectionVariables.set(\"ticketId\", data.id);\r

      });"
    language: text/javascript
settings: {}
examples: .resources/Create Ticket (Requester - Access Test).resources/examples
order: 2755
