$kind: http-request
url: "{{baseUrl}}/api/v2/tickets/:ticketId/status?status=IN_PROGRESS"
method: PATCH
queryParams:
  status: IN_PROGRESS
pathVariables:
  ticketId: "30008"
auth:
  type: bearer
  credentials:
    token: "{{agentToken}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Ticket status is IN_PROGRESS\", function () {\r

      \    const data = pm.response.json();\r

      \    pm.expect(data.status).to.eql(\"IN_PROGRESS\");\r

      });\r

      \r

      pm.test(\"Ticket ID is correct\", function () {\r

      \    const data = pm.response.json();\r

      \    pm.expect(data.id).to.eql(30008);\r

      });"
    language: text/javascript
order: 6000
