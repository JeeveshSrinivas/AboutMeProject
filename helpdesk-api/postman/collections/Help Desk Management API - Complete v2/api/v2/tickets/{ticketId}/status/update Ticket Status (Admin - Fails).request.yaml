$kind: http-request
description: ""
url: "{{baseUrl}}/api/v2/tickets/:ticketId/status?status=IN_PROGRESS"
method: PATCH
headers:
  Accept: "*/*"
queryParams:
  - key: status
    value: IN_PROGRESS
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "enum": [
              "OPEN",
              "IN_PROGRESS",
              "RESOLVED",
              "CLOSED"
            ]
          }
        },
        "required": [
          "value"
        ]
      }
pathVariables:
  - key: ticketId
    value: "30008"
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "format": "int64"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 403 Forbidden\", function () {\r

      \    pm.response.to.have.status(403);\r

      });\r

      \r

      pm.test(\"Error message confirms access is forbidden\", function () {\r

      \    const data = pm.response.json();\r

      \    pm.expect(data.error).to.eql(\"Forbidden\");\r

      });\r

      \r

      pm.test(\"Forbidden response contains a message\", function () {\r

      \    const data = pm.response.json();\r

      \    pm.expect(data.message).to.be.a(\"string\").and.not.empty;\r

      });"
    language: text/javascript
settings: {}
examples: .resources/update Ticket Status (Admin - Fails).resources/examples
order: 1000
