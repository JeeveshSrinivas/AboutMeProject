$kind: http-request
url: "{{baseUrl}}/api/v2/tickets/:ticketId/status?status=IN_PROGRESS"
method: PATCH
queryParams:
  status: IN_PROGRESS
pathVariables:
  ticketId: "30008"
auth:
  type: bearer
  credentials:
    token: "{{agentToken}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 400 Bad Request\", function () {\r

      \    pm.response.to.have.status(400);\r

      });\r

      \r

      pm.test(\"Error response contains a message\", function () {\r

      \    const data = pm.response.json();\r

      \    pm.expect(data.message).to.be.a(\"string\").and.not.empty;\r

      });\r

      \r

      pm.test(\"Closed ticket cannot be reopened\", function () {\r

      \    const data = pm.response.json();\r

      \    pm.expect(data.message).to.include(\"Cannot change ticket status\");\r

      });"
    language: text/javascript
