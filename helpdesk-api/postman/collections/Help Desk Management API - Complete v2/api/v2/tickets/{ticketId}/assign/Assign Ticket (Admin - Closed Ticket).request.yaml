$kind: http-request
description: ""
url: "{{baseUrl}}/api/v2/tickets/:ticketId/assign"
method: PATCH
headers:
  Content-Type: application/json
  Accept: "*/*"
pathVariables:
  - key: ticketId
    value: "10002"
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "format": "int64"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "agentId": 5
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "agentId": {
          "type": "integer",
          "format": "int64"
        }
      },
      "required": [
        "agentId"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Admin cannot assign an agent to a closed ticket\", function ()
      {\r

      \    pm.response.to.have.status(400);\r

      });\r

      \r

      pm.test(\"Correct closed ticket error is returned\", function () {\r

      \    const data = pm.response.json();\r

      \r

      \    pm.expect(data.message).to.include(\"resolved or closed\");\r

      });"
    language: text/javascript
settings: {}
examples: .resources/Assign Ticket (Admin - Closed Ticket).resources/examples
order: 4000
