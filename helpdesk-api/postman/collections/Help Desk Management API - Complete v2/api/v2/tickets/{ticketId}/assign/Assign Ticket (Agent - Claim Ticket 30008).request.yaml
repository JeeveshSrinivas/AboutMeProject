$kind: http-request
description: ""
url: "{{baseUrl}}/api/v2/tickets/:ticketId/assign"
method: PATCH
headers:
  Content-Type: application/json
  Accept: "*/*"
pathVariables:
  - key: ticketId
    value: "30008"
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "format": "int64"
          }
        },
        "required": [
          "value"
        ]
      }
auth:
  type: bearer
  credentials:
    token: "{{agentToken}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Agent can claim an unassigned OPEN ticket\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Ticket is assigned to an agent\", function () {\r

      \    const data = pm.response.json();\r

      \r

      \    pm.expect(data.assignedAgentId).to.not.be.null;\r

      \    pm.expect(data.status).to.eql(\"OPEN\");\r

      });"
    language: text/javascript
settings: {}
examples: .resources/Assign Ticket (Agent - Claim Ticket 30008).resources/examples
order: 6301
