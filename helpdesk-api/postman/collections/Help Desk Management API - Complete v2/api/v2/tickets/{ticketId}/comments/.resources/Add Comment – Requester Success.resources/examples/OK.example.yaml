$kind: http-example
request:
  url: "{{baseUrl}}/api/v2/tickets/:ticketId/comments"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: "*/*"
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    ticketId: "5690"
  body:
    type: json
    content: |-
      {
        "message": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "id": "string",
        "ticketId": 1538,
        "authorId": 6475,
        "message": "string",
        "createdAt": "1965-09-21T23:59:02.820Z"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "ticketId": {
            "type": "integer",
            "format": "int64"
          },
          "authorId": {
            "type": "integer",
            "format": "int64"
          },
          "message": {
            "type": "string"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      }
order: 1000
