$kind: http-request
description: ""
url: "{{baseUrl}}/api/v2/auth/login"
method: POST
headers:
  Content-Type: application/json
  Accept: "*/*"
body:
  type: json
  content: |-
    {
        "email": "requester2@example.com",
        "password": "ChooseYourOwnPassword123"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "email": {
          "type": "string",
          "minLength": 1,
          "format": "email"
        },
        "password": {
          "type": "string",
          "minLength": 1
        }
      },
      "required": [
        "email",
        "password"
      ]
    }
scripts:
  - type: afterResponse
    code: "const response = pm.response.json();\r

      \r

      if (pm.response.code === 200 && response.token && response.user) {\r

      \    const role = response.user.role;\r

      \r

      \    if (role === \"ADMIN\") {\r

      \        pm.collectionVariables.set(\"adminToken\", response.token);\r

      \    } \r

      \    else if (role === \"AGENT\") {\r

      \        pm.collectionVariables.set(\"agentToken\", response.token);\r

      \    } \r

      \    else if (role === \"REQUESTER\") {\r

      \        pm.collectionVariables.set(\"requesterToken\", response.token);\r

      \    }\r

      \r

      \    console.log(\"JWT token saved for role:\", role);\r

      }\r

      \r

      pm.test(\"Login successful\", function () {\r

      \    pm.response.to.have.status(200);\r

      });"
    language: text/javascript
settings: {}
examples: ./.resources/login User.resources/examples
order: 6000
