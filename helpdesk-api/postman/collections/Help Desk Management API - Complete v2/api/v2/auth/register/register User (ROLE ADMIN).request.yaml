$kind: http-request
description: ""
url: "{{baseUrl}}/api/v2/auth/register"
method: POST
headers:
  Content-Type: application/json
  Accept: "*/*"
body:
  type: json
  content: |-
    {
        "fullName": "Role Test User",
        "email": "role.test.requester@example.com",
        "password": "DummyTestPass123",
        "role": "ADMIN"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "fullName": {
          "type": "string",
          "minLength": 1
        },
        "email": {
          "type": "string",
          "minLength": 1,
          "format": "email"
        },
        "password": {
          "type": "string",
          "minLength": 8,
          "maxLength": 2147483647
        }
      },
      "required": [
        "email",
        "fullName",
        "password"
      ]
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: "pm.test(\"Registration successful\", function () {\r

      \    pm.expect(pm.response.code).to.be.oneOf([200, 201]);\r

      });\r

      \r

      pm.test(\"Response contains registered user details\", function () {\r

      \    const data = pm.response.json();\r

      \    pm.expect(data).to.be.an(\"object\");\r

      });\r

      \r

      pm.test(\"Registered user has REQUESTER role\", function () {\r

      \    const data = pm.response.json();\r

      \    pm.expect(data.role).to.eql(\"REQUESTER\");\r

      });"
    language: text/javascript
settings: {}
examples: .resources/register User (ROLE ADMIN).resources/examples
order: 3000
